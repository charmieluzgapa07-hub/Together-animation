<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Live Stream 3D Flapping Logo Overlay</title>
    <!-- Three.js Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, logoBadge;
        let time = 0;
        
        const logoUrl = 'https://i.postimg.cc/q7phbDXB/Code-Generated-Image-(7).png';

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 7);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x000000, 0);
            container.appendChild(renderer.domElement);

            // Balanseng liwanag para sa paligid
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const frontLight = new THREE.DirectionalLight(0xffffff, 0.8);
            frontLight.position.set(0, 0, 5);
            scene.add(frontLight);

            loadLogoTexture(logoUrl);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function loadLogoTexture(url) {
            const textureLoader = new THREE.TextureLoader();
            textureLoader.crossOrigin = 'anonymous';

            textureLoader.load(url, function(texture) {
                texture.generateMipmaps = true;
                texture.minFilter = THREE.LinearMipmapLinearFilter;
                createBadge(texture);
            });
        }

        function createBadge(texture) {
            const radius = 2.2;
            const thickness = 0.25;
            const segments = 64;

            const geometry = new THREE.CylinderGeometry(radius, radius, thickness, segments);

            // Ginawang mas solid at makintab ang gilid (gold rim)
            const goldMaterial = new THREE.MeshStandardMaterial({
                color: 0xe6c567,
                metalness: 0.9,
                roughness: 0.15,
            });

            // Ginamit ang MeshBasicMaterial o MeshLambertMaterial sa logo face 
            // para hindi ito maapektuhan ng harsh reflections at lumitaw nang buo ang mga letra
            const logoMaterial = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
                opacity: 1.0
            });

            const materials = [
                goldMaterial, // Gilid
                logoMaterial, // Harap (malinaw ang text)
                logoMaterial  // Likod
            ];

            logoBadge = new THREE.Mesh(geometry, materials);
            logoBadge.rotation.x = Math.PI / 2;
            scene.add(logoBadge);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (logoBadge) {
                time += 0.03;
                // Flapping / Waving animation nang walang ikot
                logoBadge.rotation.y = Math.sin(time * 0.6) * 0.15;
                logoBadge.rotation.x = (Math.PI / 2) + Math.sin(time * 1.2) * 0.18;
                logoBadge.rotation.z = Math.cos(time * 0.9) * 0.08;
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
